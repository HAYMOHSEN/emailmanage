<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg class="ic" style="width:24px;height:24px"><use href="#i-logo"/></svg></div>
      <div class="brand-text"><div class="brand-name" data-i18n="appName"></div><div class="brand-tag" data-i18n="tagline"></div></div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="inbox"><svg class="ic"><use href="#i-inbox"/></svg><span data-i18n="nav_inbox"></span><span class="nav-count" id="countInbox"></span></button>
      <button class="nav-item" data-view="board"><svg class="ic"><use href="#i-board"/></svg><span data-i18n="nav_board"></span></button>
      <button class="nav-item" data-view="stats"><svg class="ic"><use href="#i-chart"/></svg><span data-i18n="nav_stats"></span></button>
      <button class="nav-item" data-view="settings"><svg class="ic"><use href="#i-settings"/></svg><span data-i18n="nav_settings"></span></button>
    </nav>
    <div class="sidebar-block">
      <h4 data-i18n="help_drag"></h4>
      <p data-i18n="empty_outlook"></p>
      <button class="btn sm" id="btnSamples"><svg class="ic sm"><use href="#i-zap"/></svg><span data-i18n="btn_samples"></span></button>
    </div>
    <div class="sidebar-footer">
      <button class="btn sm" id="btnLang"><svg class="ic sm"><use href="#i-globe"/></svg><span id="btnLangText"></span></button>
      <button class="icon-btn" id="btnTheme" title=""><svg class="ic"><use href="#i-moon"/></svg></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="btnMenu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="search"><svg class="ic"><use href="#i-search"/></svg><input id="searchInput" type="search" autocomplete="off"></div>
      <div class="topbar-actions">
        <button class="btn" id="btnPaste"><svg class="ic"><use href="#i-paste"/></svg><span data-i18n="btn_paste"></span></button>
        <button class="btn btn-primary" id="btnImport"><svg class="ic"><use href="#i-upload"/></svg><span data-i18n="btn_import"></span></button>
        <input type="file" id="fileInput" multiple accept=".eml,.msg,message/rfc822,application/vnd.ms-outlook" hidden>
      </div>
    </header>

    <section class="view active" id="view-inbox">
      <div class="inbox-layout" id="inboxLayout">
        <div class="list-pane">
          <div class="list-toolbar">
            <div class="filters" id="filters"></div>
            <div class="list-meta"><span id="listCount"></span><select class="sel" id="sortSelect"></select></div>
          </div>
          <div class="bulk-bar" id="bulkBar" hidden></div>
          <div class="email-list" id="emailList"></div>
        </div>
        <div class="detail-pane" id="detailPane"></div>
      </div>
    </section>
    <section class="view" id="view-board"><div class="board-wrap"><div class="board-head"><div><h2 data-i18n="nav_board"></h2><p data-i18n="board_hint"></p></div></div><div class="board" id="board"></div></div></section>
    <section class="view" id="view-stats"><div class="stats-wrap" id="stats"></div></section>
    <section class="view" id="view-settings"><div class="settings-wrap" id="settings"></div></section>
  </main>
</div>

<div class="drop-overlay" id="dropOverlay"><div class="drop-box"><div class="ico"><svg class="ic"><use href="#i-upload"/></svg></div><h2 data-i18n="drop_title"></h2><p data-i18n="drop_sub"></p></div></div>
<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script src="js/i18n.js"></script>
<script src="js/db.js"></script>
<script src="js/mime.js"></script>
<script src="js/msg.js"></script>
<script src="js/engine.js"></script>
<script src="js/samples.js"></script>
<script src="js/app.js"></script>
<script src="js/editor.js"></script>
<script src="js/notes.js"></script>
<script src="js/reply.js"></script>
<script src="js/extras.js"></script>
</body>
</html>
